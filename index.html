<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daisy Zhang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
/* Palette: Chinese ink-wash painting on xuan paper (bright off-white with soft cloudy SVG mottling) (rice paper, teal mountain wash, ink, vermilion sun). Layout: full-width intro, then three ruled columns (reading · learning · tally) like a college bulletin board; stacks on phones */
:root{
  --bg:#F7F5F0; --paper:#FCFBF8; --ink:#1E1B19; --muted:#6B645D; --rule:#E3DED6;
  --accent:#276F6C; --accent-soft:#D9E7E3; --mark:#E2462C; --wash:#EFC8BA;
  --paper-tex:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='1024' height='1024'><filter id='f' x='0' y='0'><feTurbulence type='fractalNoise' baseFrequency='.0025' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.55 0 0 0 0 0.47 0 0 0 0 0.38 0.140 0 0 0 -0.045'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>"), url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512'><filter id='f' x='0' y='0'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='2' seed='9' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.55 0 0 0 0 0.47 0 0 0 0 0.38 0.060 0 0 0 -0.022'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");
  --display:"Schibsted Grotesk", "Public Sans", system-ui, sans-serif;
  --body:"Public Sans", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1817; --paper:#221F1D; --ink:#EDE5DC; --muted:#A89E94; --rule:#38312C;
  --accent:#7CC3BD; --accent-soft:#22332F; --mark:#E0553A; --wash:#5A3027;
  --paper-tex:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='1024' height='1024'><filter id='f' x='0' y='0'><feTurbulence type='fractalNoise' baseFrequency='.0025' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95 0 0 0 0 0.9 0 0 0 0 0.84 0.070 0 0 0 -0.022'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>"), url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512'><filter id='f' x='0' y='0'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='2' seed='9' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95 0 0 0 0 0.9 0 0 0 0 0.84 0.030 0 0 0 -0.011'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>"); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1817; --paper:#221F1D; --ink:#EDE5DC; --muted:#A89E94; --rule:#38312C;
  --accent:#7CC3BD; --accent-soft:#22332F; --mark:#E0553A; --wash:#5A3027;
  --paper-tex:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='1024' height='1024'><filter id='f' x='0' y='0'><feTurbulence type='fractalNoise' baseFrequency='.0025' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95 0 0 0 0 0.9 0 0 0 0 0.84 0.070 0 0 0 -0.022'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>"), url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512'><filter id='f' x='0' y='0'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='2' seed='9' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95 0 0 0 0 0.9 0 0 0 0 0.84 0.030 0 0 0 -0.011'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>"); color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--bg);background-image:var(--paper-tex);color:var(--ink);font:16px/1.6 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;padding-block:40px 80px;display:flex;flex-direction:column;gap:48px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-0.015em;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(2.2rem,6vw,3.4rem)}
h2{font-size:1.5rem}
h3{font-size:1.15rem}
p{margin:0}
.label{font:500 .72rem/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.code{font:500 .85rem/1.2 var(--mono);color:var(--accent);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sample{font:500 .66rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--muted);padding:2px 6px;border-radius:3px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.more{font:500 .8rem var(--mono);letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
.stack{display:flex;flex-direction:column;gap:44px}

/* masthead */
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:14px}
.mast a.name{text-decoration:none;color:var(--ink);font:600 .85rem/1.2 var(--display);letter-spacing:.16em;text-transform:uppercase}
.mast nav{display:flex;gap:20px}
.mast nav a{font:500 .8rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.mast nav a[aria-current]{color:var(--accent);text-decoration:underline}

/* news ticker */
.ticker{display:flex;align-items:stretch;background:var(--ink);color:var(--bg);border-radius:3px;overflow:hidden;min-width:0}
.ticker-tag{flex:none;display:flex;align-items:center;padding:0 14px;background:var(--mark);color:var(--paper);font:500 .72rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.ticker-view{flex:1;min-width:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 40px),transparent)}
.ticker-track{display:flex;width:max-content;animation:tick var(--dur,40s) linear infinite}
.ticker:hover .ticker-track,.ticker:focus-within .ticker-track{animation-play-state:paused}
.ticker-seq{display:flex;align-items:center;gap:14px;padding:11px 14px 11px 18px;white-space:nowrap}
.ticker a{color:inherit;font-weight:600;text-decoration:none}
.ticker a:hover{text-decoration:underline}
.ticker a:focus-visible{outline-color:var(--mark)}
.ticker .src{font:400 .78rem var(--mono);letter-spacing:.04em;opacity:.7}
.ticker .sep{color:var(--mark);padding:0 6px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){
  .ticker-track{animation:none}
  .ticker-view{overflow-x:auto;-webkit-mask-image:none;mask-image:none}
  .ticker-seq[aria-hidden]{display:none}
}

.hero{display:flex;flex-direction:column;gap:18px}
.hero .lede{font-size:1.12rem;max-width:68ch;color:var(--muted)}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 58%,var(--wash) 58%)}

/* three columns */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--ink)}
.col{display:flex;flex-direction:column;gap:18px;padding:22px 28px 8px;min-width:0}
.col:first-child{padding-left:0}
.col:last-child{padding-right:0}
.col + .col{border-left:1px solid var(--rule)}
.col-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
@media (max-width:860px){
  .board{grid-template-columns:1fr}
  .col{padding:24px 0}
  .col + .col{border-left:0;border-top:1px solid var(--rule)}
}

/* reading */
.reads{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.reads li{display:grid;grid-template-columns:18px 1fr;gap:8px}
.reads .arrow{color:var(--accent);font-family:var(--mono)}
.reads a.t{font-weight:600;color:var(--ink);text-decoration-color:var(--rule)}
.reads a.t:hover{text-decoration-color:var(--accent)}
.reads .src{display:block;margin-top:2px}
.reads .note{font-size:.92rem;color:var(--muted);margin-top:4px}

/* learning */
.topic h3{font-size:1.4rem}
.bar{height:8px;background:var(--accent-soft);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:4px}

/* tally */
.count{display:flex;flex-direction:column;gap:2px}
.count strong{font:600 3rem/1 var(--display);letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.count strong.pending{color:var(--muted);font-size:2rem}
.posters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.posters a,.posters span{aspect-ratio:2/3;max-width:100%;border-radius:3px;overflow:hidden;background:var(--accent-soft);border:1px solid var(--rule);display:block}
.posters img{width:100%;height:100%;object-fit:cover;display:block}
.tally-sep{border:0;border-top:1px solid var(--rule);margin:4px 0}

/* syllabus page */
.syl-head{display:flex;flex-direction:column;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:22px}
.syl-head p{max-width:64ch;color:var(--muted);font-size:1.08rem}
.meta{display:flex;flex-wrap:wrap;gap:16px 40px}
.meta div{display:flex;flex-direction:column;gap:4px}
.why{border-left:3px solid var(--mark);padding:4px 0 4px 18px;max-width:64ch}
.units{display:flex;flex-direction:column;border-top:1px solid var(--rule);max-width:820px}
.unit{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:22px 0;border-bottom:1px solid var(--rule)}
.unit > div{min-width:0;display:flex;flex-direction:column;gap:10px}
.unit ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.unit li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:.96rem}
.unit li .box{font-family:var(--mono);color:var(--accent)}
.unit li.done > span:last-child{color:var(--muted)}
@media (max-width:560px){.unit{grid-template-columns:1fr;gap:6px}}

/* archive */
.list{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink);max-width:820px}
.list li{border-bottom:1px solid var(--rule)}
.list a{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 4px;text-decoration:none;color:var(--ink)}
.list a:hover{background:var(--paper)}
.empty{color:var(--muted);padding:16px 0;border-bottom:1px solid var(--rule)}

article{display:flex;flex-direction:column;gap:22px;max-width:66ch}
article .prose{display:flex;flex-direction:column;gap:18px;font-size:1.08rem;line-height:1.75}

footer{border-top:1px solid var(--rule);padding-top:16px;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:no-preference){#view>*{animation:rise .35s ease both}}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="mast">
    <a class="name" href="#home">Daisy Zhang</a>
    <nav aria-label="Sections">
      <a href="#home" data-nav="home">Home</a>
      <a href="#archive" data-nav="archive">Archive</a>
      <a href="#about" data-nav="about">About</a>
    </nav>
  </header>
  <main id="view"></main>
  <footer>An independent curriculum, kept in public.</footer>
</div>

<script>
/* ================= CONTENT: edit everything here ================= */

/* What I'm Reading This Week: up to three links */
const READING = {
  week: "Nov 2, 2026",
  items: [
    {title:"Silicon Valley Is Bracing for a Permanent Underclass", source:"The New York Times", url:"https://www.nytimes.com/2026/04/30/opinion/ai-labor-work-force-silicon-valley.html", note:""},
    {title:"Surviving Involution", source:"Rob L'Heureux · Happy Future", url:"https://roblh.substack.com/p/surviving-involution", note:""}
  ]
};

/* What I'm Learning: one current topic */
const CURRENT = {
  id:"china-us", code:"CUS 101", title:"China–US Relations", sample:true,
  why:"Sample text. A sentence or two on why this topic, and why now.",
  started:"Nov 2026",
  units:[
    {n:"Unit 1", title:"The long view", desc:"Sample unit: how the relationship got here.",
      items:[{t:"Henry Kissinger, On China",done:false}]},
    {n:"Unit 2", title:"Rivalry and its risks", desc:"Sample unit.",
      items:[{t:"Graham Allison, Destined for War",done:false},{t:"Rush Doshi, The Long Game",done:false}]},
    {n:"Unit 3", title:"Technology and trade", desc:"Sample unit.",
      items:[{t:"Chris Miller, Chip War",done:false}]}
  ]
};

/* Finished topics move here, newest first. Same shape as CURRENT, plus finished:"Mon YYYY" */
const ARCHIVE = [];

/* Past weekly reading lists move here, newest first */
const PAST_READING = [];

/* Books: update by hand */
const BOOKS = { year:2027, startsOn:"Jan 1, 2027", titles:[] };

/* Films: filled automatically from films.json (Letterboxd) once connected */
const LETTERBOXD_USER = "";

/* ================= END CONTENT ================= */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sampleTag = x => x && x.sample ? '<span class="sample">Sample</span>' : '';
const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : "#";
let FILMS = null;

function progress(t){
  const items = t.units.flatMap(u=>u.items);
  const done = items.filter(i=>i.done).length;
  let idx = t.units.findIndex(u=>u.items.some(i=>!i.done));
  if(idx<0) idx = t.units.length-1;
  return {pct: items.length ? Math.round(done/items.length*100) : 0, done, total:items.length, idx};
}

function readingCol(){
  const items = READING.items.slice(0,3);
  return `<section class="col" aria-labelledby="h-read">
    <div class="col-head"><h2 id="h-read">Reading this week</h2></div>
    <span class="label">Week of ${esc(READING.week)}${sampleTag(READING)}</span>
    ${items.length ? `<ul class="reads">${items.map(r=>`<li>
      <span class="arrow" aria-hidden="true">→</span>
      <div><a class="t" href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener">${esc(r.title)}</a>
      <span class="src label">${esc(r.source)}</span>
      ${r.note?`<p class="note">${esc(r.note)}</p>`:''}</div></li>`).join('')}</ul>`
    : '<p class="muted">Nothing on the list this week.</p>'}
  </section>`;
}

function learningCol(){
  const t = CURRENT, p = progress(t), u = t.units[p.idx];
  return `<section class="col topic" aria-labelledby="h-learn">
    <div class="col-head"><h2 id="h-learn">What I'm learning</h2></div>
    <span class="code">${esc(t.code)} · since ${esc(t.started)}${sampleTag(t)}</span>
    <h3>${esc(t.title)}</h3>
    <p class="muted">${esc(t.why)}</p>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span class="label">Unit ${p.idx+1} of ${t.units.length} · ${esc(u.title)}</span>
      <div class="bar" role="img" aria-label="${p.pct}% of readings done"><span style="width:${p.pct}%"></span></div>
      <span class="label">${p.done} of ${p.total} readings done</span>
    </div>
    <a class="more" href="#syllabus">View syllabus →</a>
  </section>`;
}

function filmsBlock(){
  const yr = new Date().getFullYear();
  if(!FILMS){
    return `<div class="count"><span class="label">Films watched · ${yr}</span>
      <strong class="pending">—</strong>
      <span class="label">${LETTERBOXD_USER ? 'Updating from Letterboxd' : 'Connects to Letterboxd soon'}</span></div>`;
  }
  const recent = (FILMS.recent||[]).slice(0,4);
  return `<div class="count"><span class="label">Films watched · ${esc(FILMS.year)}</span>
      <strong>${esc(FILMS.count)}</strong>
      ${LETTERBOXD_USER?`<a class="label" href="https://letterboxd.com/${esc(LETTERBOXD_USER)}/" target="_blank" rel="noopener">via Letterboxd</a>`:''}</div>
    ${recent.length?`<div class="posters">${recent.map(f=>`<a href="${esc(safeUrl(f.url))}" target="_blank" rel="noopener" title="${esc(f.title)}">${f.poster?`<img src="${esc(safeUrl(f.poster))}" alt="${esc(f.title)}" loading="lazy">`:''}</a>`).join('')}</div>`:''}`;
}

function tallyCol(){
  const started = new Date() >= new Date(BOOKS.year,0,1);
  return `<section class="col" aria-labelledby="h-tally">
    <div class="col-head"><h2 id="h-tally">The tally</h2></div>
    <div class="count"><span class="label">Books read · ${esc(BOOKS.year)}</span>
      ${started ? `<strong>${BOOKS.titles.length}</strong>` : `<strong class="pending">0</strong><span class="label">Counting starts ${esc(BOOKS.startsOn)}</span>`}</div>
    <hr class="tally-sep">
    <div id="films">${filmsBlock()}</div>
  </section>`;
}

function ticker(){
  const items = READING.items.slice(0,3);
  if(!items.length) return '';
  const seq = hidden => `<div class="ticker-seq"${hidden?' aria-hidden="true"':''}>${items.map(r=>
    `<a href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener"${hidden?' tabindex="-1"':''}>${esc(r.title)}</a><span class="src">${esc(r.source)}</span><span class="sep" aria-hidden="true">◆</span>`).join('')}</div>`;
  const chars = items.reduce((n,r)=>n+r.title.length+r.source.length,0);
  const dur = Math.max(20, Math.round(chars*0.32));
  return `<div class="ticker" role="region" aria-label="What I'm reading this week">
    <span class="ticker-tag">Now reading</span>
    <div class="ticker-view"><div class="ticker-track" style="--dur:${dur}s">${seq(false)}${seq(true)}${seq(true)}${seq(true)}</div></div>
  </div>`;
}

function home(){
  return `${ticker()}<section class="hero">
    <h1>wherever <em>curiosity</em> leads</h1>
    <p class="lede">When I graduated college, I remember celebrating the end, ready to never have to write an essay, stress over an exam, or lose sleep over some group project ever again. Now, years later, I find myself reminiscing on what it was like to constantly be learning, reflecting, and questioning. Hence my personal curriculum was born. My special interests lie within technology, film, and China-US relations.</p>
  </section>
  <div class="board">${readingCol()}${learningCol()}${tallyCol()}</div>`;
}

function syllabus(t, back){
  const dates = t.finished ? `${esc(t.started)} – ${esc(t.finished)}` : `Since ${esc(t.started)}`;
  return `<a class="more" href="${back}">← ${back==="#archive"?"Archive":"Home"}</a>
  <section class="syl-head">
    <span class="code">${esc(t.code)}${sampleTag(t)}</span>
    <h1>${esc(t.title)}</h1>
    <div class="meta">
      <div><span class="label">Dates</span><span>${dates}</span></div>
      <div><span class="label">Status</span><span>${t.finished?"Completed":"In progress"}</span></div>
      <div><span class="label">Units</span><span>${t.units.length}</span></div>
    </div>
  </section>
  <section style="display:flex;flex-direction:column;gap:12px">
    <span class="label">Why I'm learning this</span>
    <p class="why">${esc(t.why)}</p>
  </section>
  <section style="display:flex;flex-direction:column;gap:14px">
    <h2>Syllabus</h2>
    <div class="units">${t.units.map(u=>`<div class="unit">
      <span class="code">${esc(u.n)}</span>
      <div><h3>${esc(u.title)}</h3>${u.desc?`<p class="muted">${esc(u.desc)}</p>`:''}
      <ul>${u.items.map(i=>`<li class="${i.done?'done':''}"><span class="box" aria-hidden="true">${i.done?'■':'□'}</span><span>${i.url?`<a href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener">${esc(i.t)}</a>`:esc(i.t)}${i.done?' <span class="label">· done</span>':''}</span></li>`).join('')}</ul></div>
    </div>`).join('')}</div>
  </section>
  ${t.reflection?`<article><span class="label">Final reflection</span><div class="prose">${t.reflection.map(p=>`<p>${esc(p)}</p>`).join('')}</div></article>`:''}`;
}

function archive(){
  return `<section class="hero"><h1>Archive</h1>
    <p class="lede">Topics I've finished, and what I was reading along the way.</p></section>
  <section style="display:flex;flex-direction:column;gap:14px">
    <h2>Finished topics</h2>
    ${ARCHIVE.length ? `<ul class="list">${ARCHIVE.map(t=>`<li><a href="#topic-${esc(t.id)}">
      <span><span class="code">${esc(t.code)}</span>&nbsp;&nbsp;${esc(t.title)}</span>
      <span class="label">${esc(t.started)} – ${esc(t.finished)}</span></a></li>`).join('')}</ul>`
      : `<p class="empty" style="border-top:2px solid var(--ink)">The first topic lands here once ${esc(CURRENT.title)} is finished.</p>`}
  </section>
  <section style="display:flex;flex-direction:column;gap:14px">
    <h2>Past reading</h2>
    ${PAST_READING.length ? PAST_READING.map(w=>`<div style="display:flex;flex-direction:column;gap:8px;max-width:820px">
      <span class="label">Week of ${esc(w.week)}</span>
      <ul class="reads">${w.items.map(r=>`<li><span class="arrow" aria-hidden="true">→</span><div><a class="t" href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener">${esc(r.title)}</a><span class="src label">${esc(r.source)}</span></div></li>`).join('')}</ul></div>`).join('')
      : `<p class="empty" style="border-top:2px solid var(--ink)">Each week's reading list moves here when the next one goes up.</p>`}
  </section>`;
}

function about(){
  return `<article><span class="label">About</span><h1>Why a personal curriculum</h1>
  <div class="prose">
    <p>School decided what I studied for a long time. This is the opposite: a curriculum built around what I'm actually curious about, at whatever pace real life allows.</p>
    <p>I study one topic at a time, with a syllabus, a reading list, and a place to check things off. When a topic is done, it goes in the archive.</p>
    <p>I'm Daisy. I live in New York and build data and mapping tools by day.</p>
  </div></article>`;
}

function render(){
  const h = (location.hash||"#home").slice(1);
  let html, nav="home";
  if(h==="syllabus") html = syllabus(CURRENT,"#home");
  else if(h.startsWith("topic-") && ARCHIVE.find(t=>t.id===h.slice(6))){ html = syllabus(ARCHIVE.find(t=>t.id===h.slice(6)),"#archive"); nav="archive"; }
  else if(h==="archive"){ html = archive(); nav="archive"; }
  else if(h==="about"){ html = about(); nav="about"; }
  else html = home();
  $("#view").innerHTML = `<div class="stack">${html}</div>`;
  document.querySelectorAll("[data-nav]").forEach(a=>a.toggleAttribute("aria-current", a.dataset.nav===nav));
  window.scrollTo(0,0);
}
addEventListener("hashchange",render);
render();

fetch("films.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{
  if(d && typeof d.count==="number"){ FILMS=d; const el=$("#films"); if(el) el.innerHTML=filmsBlock(); }
}).catch(()=>{});
</script>
